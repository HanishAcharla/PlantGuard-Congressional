name: PlantGuard
options:
  bundleIdPrefix: com.hanishacharla
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  PlantGuard:
    type: application
    platform: iOS
    sources:
      - path: PlantGuard
    info:
      path: PlantGuard/Info.plist
      properties:
        CFBundleDisplayName: PlantGuard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        NSCameraUsageDescription: PlantGuard uses the camera to photograph apple leaves for on-device disease detection.
        NSPhotoLibraryUsageDescription: PlantGuard reads leaf photos you pick so the on-device model can analyze them.
        NSLocationWhenInUseUsageDescription: PlantGuard uses your location to find the orchard tree you're standing next to.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hanishacharla.PlantGuard
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
